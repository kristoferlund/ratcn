[workspace]
resolver = "3"
members = ["crates/ratcn", "crates/copy-fixture", "crates/cargo-ratcn", "crates/showcase", "demos/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
version = "0.0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
cliclack = "0.5.6"
console = "0.16.4"
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std"] }
ratatui-termina = "0.1.0"
ratatui-textarea = { version = "0.9.2", default-features = false }
ratzilla = "0.3.1"
ratcn = { path = "crates/ratcn" }
demo-shared = { package = "shared", path = "demos/shared" }
email_address = "0.2.9"
futures-util = "0.3.32"
gloo-timers = { version = "0.3.0", features = ["futures"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "3.0.4", features = ["full"] }
toml = "1.1.4"
tui-big-text = "0.8.9"
tui-markdown = { version = "0.3.9", default-features = false }
ureq = "3.3.0"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = ["AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "Response", "Window"] }

# Input and TextArea need fixes that upstream has not released yet: the masked
# width fix and the `screen_to_data` hit test. Until a release carries them,
# the crates.io name resolves to the `ratcn` branch of our fork. Remove this
# block, and bump the version above, once upstream ships them. ratcn cannot be
# published while this patch is in place.
[patch.crates-io]
ratatui-textarea = { git = "https://github.com/kristoferlund/ratatui-textarea", rev = "36482a6e8a42c96160f5980e42f5eef9e33ed0c9" }
