[package]
name = "ratcn"
description = "Themeable terminal UI components and interaction runtime for Ratatui"
edition.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/kristoferlund/ratcn"
homepage = "https://ratcn.kristoferlund.se"
documentation = "https://docs.rs/ratcn"
keywords = ["ratatui", "tui", "terminal", "components"]
categories = ["command-line-interface"]
rust-version.workspace = true
version.workspace = true

[dependencies]
ratatui.workspace = true
ratatui-termina = { workspace = true, optional = true }
ratzilla = { workspace = true, optional = true }
termina = { version = "0.3.3", optional = true }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = [
    "ClipboardEvent",
    "DataTransfer",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "frame"
harness = false

# The feature set docs.rs builds: what a terminal consumer sees.
[package.metadata.docs.rs]
features = ["crossterm", "termina"]

[features]
default = []
crossterm = ["ratatui/crossterm"]
ratzilla = ["dep:ratzilla", "dep:web-sys"]
termina = ["dep:termina", "dep:ratatui-termina"]

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
