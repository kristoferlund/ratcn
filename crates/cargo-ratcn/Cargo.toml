[package]
name = "cargo-ratcn"
description = "Initialize Ratatui projects with ratcn and copy customizable components into your application"
edition.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/kristoferlund/ratcn"
homepage = "https://ratcn.kristoferlund.se"
documentation = "https://docs.rs/cargo-ratcn"
keywords = ["ratcn", "ratatui", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
rust-version.workspace = true
version = "0.0.1"

[dependencies]
anyhow.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
cliclack.workspace = true
console.workspace = true
syn.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
