<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Iframed into the docs site; the page itself has no content to rank. -->
    <meta name="robots" content="noindex" />
    <script type="module" src="./ratatui-keyboard-capture.js"></script>
    <link
      data-trunk
      rel="rust"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-sign-ext --enable-nontrapping-float-to-int"
      data-initializer="./initializer.js"
    />
    <link data-trunk rel="copy-file" href="../shared/ratatui-keyboard-capture.js" />
    <link data-trunk rel="copy-file" href="../shared/fonts/JetBrainsMonoNerdFontMono-Regular.ttf" />
    <link data-trunk rel="copy-file" href="../shared/fonts/OFL.txt" />
    <link data-trunk rel="css" href="./landing.css" />
    <title>ratcn landing grid</title>
  </head>
  <!-- The Alt hotkeys the keyboard capture forwards by physical key, so
       Option+D on a Mac is Alt+D rather than "∂". Text wins over a tile
       hotkey: where Option types punctuation, such as @ from Option+2 or [
       from Option+8 on a Swedish Mac, a field types it. -->
  <body tabindex="0" data-alt-hotkeys="1 2 3 4 5 6 7 8 d s"></body>
</html>
