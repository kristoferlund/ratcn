[package]
name = "ui-f-state"
publish = false
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
demo-shared.workspace = true
ratatui.workspace = true
ratcn.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratcn = { workspace = true, features = ["termina"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratcn = { workspace = true, features = ["ratzilla"] }
ratzilla.workspace = true

# `App::new` is the demo's entry point; a `Default` forwarding to it would be a
# second, surprising one.
[lints.clippy]
new_without_default = "allow"
